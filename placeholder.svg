<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
<title id="title">Astrophotography placeholder</title>
<desc id="desc">Abstract night sky with stars and a softly glowing nebula. Replace with your own astrophotograph.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d17"/><stop offset=".55" stop-color="#17202d"/><stop offset="1" stop-color="#080a10"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#a9b9b0" stop-opacity=".45"/><stop offset=".45" stop-color="#738ba0" stop-opacity=".15"/><stop offset="1" stop-color="#738ba0" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
</defs>
<rect width="1400" height="700" fill="url(#bg)"/>
<ellipse cx="780" cy="330" rx="440" ry="270" fill="url(#glow)" filter="url(#blur)"/>
<path d="M300 520 Q510 170 760 300 T1200 190" fill="none" stroke="#c4d1d4" stroke-opacity=".14" stroke-width="48" filter="url(#blur)"/>
<g fill="#fff">
<circle cx="90" cy="90" r="2"/><circle cx="220" cy="220" r="1.5"/><circle cx="350" cy="75" r="2"/><circle cx="490" cy="180" r="1.4"/><circle cx="620" cy="80" r="1.8"/><circle cx="790" cy="130" r="2.2"/><circle cx="960" cy="75" r="1.4"/><circle cx="1130" cy="140" r="1.8"/><circle cx="1300" cy="80" r="2"/><circle cx="120" cy="400" r="1.5"/><circle cx="260" cy="590" r="2"/><circle cx="430" cy="430" r="1.4"/><circle cx="580" cy="580" r="2"/><circle cx="740" cy="490" r="1.6"/><circle cx="900" cy="600" r="2"/><circle cx="1040" cy="430" r="1.4"/><circle cx="1190" cy="550" r="2"/><circle cx="1340" cy="370" r="1.5"/><circle cx="1020" cy="250" r="2.5"/><circle cx="690" cy="250" r="1.4"/><circle cx="400" cy="300" r="1.7"/><circle cx="850" cy="390" r="1.4"/>
</g>
<text x="700" y="360" text-anchor="middle" fill="#e7ece9" font-family="Arial,sans-serif" font-size="23" letter-spacing="8" opacity=".7">YOUR ASTROPHOTOGRAPH</text>
<text x="700" y="397" text-anchor="middle" fill="#c1cbc8" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" opacity=".65">REPLACE THIS PLACEHOLDER IMAGE</text>
</svg>